name: "Library tests"

on:
  workflow_dispatch:
  pull_request:
    branches-ignore:
      - 'release-**'
    paths:
      - 'lib/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v18
      - run: nix-build lib/tests/release.nix
